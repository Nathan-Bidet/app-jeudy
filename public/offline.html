<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Connexion indisponible</title>
    <style>
        :root {
            color-scheme: light;
        }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: Montserrat, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: radial-gradient(circle at top, #fff7d1 0%, #f6f7f9 45%, #eef1f5 100%);
            color: #1f2937;
            padding: 24px;
            box-sizing: border-box;
        }
        .card {
            width: 100%;
            max-width: 520px;
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
            padding: 24px;
            text-align: center;
        }
        .logo-wrap {
            width: 72px;
            height: 72px;
            border-radius: 18px;
            background: #ffffff;
            border: 1px solid #e5e7eb;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            box-shadow: 0 6px 18px rgba(15, 23, 42, 0.08);
        }
        .logo-wrap img {
            width: 44px;
            height: 44px;
            object-fit: contain;
        }
        h1 {
            margin: 0 0 10px;
            font-size: 1.5rem;
            line-height: 1.2;
        }
        p {
            margin: 0 0 20px;
            color: #4b5563;
        }
        button {
            border: 0;
            border-radius: 12px;
            padding: 12px 16px;
            width: 100%;
            font-weight: 700;
            cursor: pointer;
            background: #f1bf0c;
            color: #111827;
        }
    </style>
</head>
<body>
<main class="card">
    <div class="logo-wrap">
        <img src="/pwa-192.png" alt="Jeudy">
    </div>
    <h1>Connexion indisponible</h1>
    <p>Certaines fonctions nécessitent Internet.</p>
    <button type="button" onclick="window.location.reload()">Réessayer</button>
</main>
</body>
</html>
